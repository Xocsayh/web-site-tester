[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cookiemonster-audit"
dynamic = ["version"]
description = "CookieMonster - passive website security auditor for the terminal. Om nom nom."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ahmet Kugu" }]
dependencies = [
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "colorama>=0.4.6",
]
keywords = ["security", "audit", "cli", "kali", "headers", "tls", "cookies", "passive"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Environment :: Console",
  "Topic :: Security",
  "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/Xocsayh/web-site-tester"

[project.scripts]
cookiemonster = "cookiemonster.cli:main"

[tool.setuptools.dynamic]
version = { attr = "cookiemonster.__version__" }

[tool.setuptools.packages.find]
include = ["cookiemonster*"]
